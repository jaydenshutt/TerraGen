# TerraGen sample — GCP custom VPC + Cloud NAT
project: demo-gcp
cloud: gcp
region: us-central1
environment: dev
blueprint: network
vpc_cidr: 10.30.0.0/16
az_count: 2
nat_mode: single
enable_flow_logs: true
enable_bastion_sg: true
ssh_cidrs:
  - 10.0.0.0/8
gcp_project_id: my-gcp-billing-project
enable_backend: true
enable_bootstrap: true
owner: platform-team
