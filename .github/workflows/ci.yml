name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q --cov=terragen --cov-report=term-missing
      - name: Doctor
        run: python -m terragen doctor
      - name: Schema
        run: python -m terragen schema -o /tmp/answers.schema.json
      - name: Version
        run: python -m terragen version

  terraform-validate:
    name: Terraform validate (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core networks
          - profile: aws-flat
            answers: examples/answers-aws.yaml
            workdir: .
          - profile: aws-secure
            answers: examples/answers-aws-secure.yaml
            workdir: .
          - profile: aws-private
            answers: examples/answers-private-only.yaml
            workdir: .
          - profile: aws-modular
            answers: examples/answers-modular.yaml
            workdir: envs/dev
          - profile: gcp
            answers: examples/answers-gcp.yaml
            workdir: .
          - profile: azure
            answers: examples/answers-azure.yaml
            workdir: .
          - profile: aws-3tier
            answers: examples/answers-3tier.yaml
            workdir: .
          # K8s-ready networks
          - profile: aws-eks-ready
            answers: examples/answers-eks-ready.yaml
            workdir: .
          - profile: gcp-gke-ready
            answers: examples/answers-gke-ready.yaml
            workdir: .
          - profile: azure-aks-ready
            answers: examples/answers-aks-ready.yaml
            workdir: .
          # Full clusters (v3)
          - profile: aws-eks-cluster
            answers: examples/answers-eks-cluster.yaml
            workdir: .
          - profile: gcp-gke-cluster
            answers: examples/answers-gke-cluster.yaml
            workdir: .
          - profile: azure-aks-cluster
            answers: examples/answers-aks-cluster.yaml
            workdir: .
          # Topology / dual-stack
          - profile: aws-hub-spoke
            answers: examples/answers-hub-spoke.yaml
            workdir: .
          - profile: aws-ipv6
            answers: examples/answers-ipv6.yaml
            workdir: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TerraGen
        run: pip install -e .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false
      - name: Generate
        run: |
          python -m terragen generate --answers ${{ matrix.answers }} --out /tmp/tg --force
      - name: Terraform fmt
        run: terraform fmt -recursive
        working-directory: /tmp/tg
      - name: Terraform init + validate
        working-directory: /tmp/tg/${{ matrix.workdir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Bootstrap validate
        working-directory: /tmp/tg/bootstrap
        run: |
          if [ -f main.tf ]; then
            terraform init -backend=false -input=false
            terraform validate
          else
            echo "No bootstrap stack; skip"
          fi

  brownfield-import:
    name: Brownfield import validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TerraGen
        run: pip install -e .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false
      - name: Import from sample inventory
        run: |
          python -m terragen import --inventory examples/inventory-aws-sample.json --out /tmp/imported
      - name: Terraform validate import project
        working-directory: /tmp/imported
        run: |
          terraform fmt -recursive
          terraform init -backend=false -input=false
          terraform validate
